services:
  # ============================================================================
  # 1. Banco de Dados Relacional PostgreSQL 16 (Multi-Tenant & Trilha de Auditoria)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: netpulse_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${NETPULSE_POSTGRES_DB:-netpulse}
      POSTGRES_USER: ${NETPULSE_POSTGRES_USER:-netpulse}
      POSTGRES_PASSWORD: ${NETPULSE_POSTGRES_PASSWORD:-netpulse_secret}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - netpulse_postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_init_schema.sql:/docker-entrypoint-initdb.d/001_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${NETPULSE_POSTGRES_USER:-netpulse} -d ${NETPULSE_POSTGRES_DB:-netpulse}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - netpulse_net

  # ============================================================================
  # 2. NetPulse Backend API & Telemetry Engine (Go)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netpulse_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "8080"
      DATA_DIR: "/app/data"
      DATABASE_URL: "postgres://${NETPULSE_POSTGRES_USER:-netpulse}:${NETPULSE_POSTGRES_PASSWORD:-netpulse_secret}@postgres:5432/${NETPULSE_POSTGRES_DB:-netpulse}?sslmode=disable"
      JWT_SECRET: "${JWT_SECRET:-netpulse_super_secret_jwt_key_2026_enterprise}"
      DEVICE_ENCRYPTION_KEY: "${DEVICE_ENCRYPTION_KEY:-netpulse-dev-secret-key-32bytes!!}"
      SYSLOG_PORT: "1514"
      BMP_PORT: "11019"
      POLL_INTERVAL: "${POLL_INTERVAL:-45}"
      DISABLE_LICENSE_CHECK: "${DISABLE_LICENSE_CHECK:-true}"
      NETPULSE_STANDALONE_MODE: "${NETPULSE_STANDALONE_MODE:-true}"
      SEED_SAMPLE_DEVICES: "${SEED_SAMPLE_DEVICES:-false}"
    ports:
      - "${NETPULSE_BACKEND_PORT:-${BACKEND_PORT:-8085}}:8080"
      - "${BMP_PORT:-11019}:11019/tcp"
      - "${SYSLOG_PORT:-1514}:1514/udp"
    volumes:
      - netpulse_backend_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - netpulse_net

  # ============================================================================
  # 3. NetPulse Frontend Web UI (React / Vite + Nginx Reverse Proxy)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netpulse_frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${NETPULSE_FRONTEND_PORT:-${WEB_PORT:-3000}}:80"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3
    networks:
      - netpulse_net

volumes:
  netpulse_postgres_data:
    name: netpulse_postgres_data
  netpulse_backend_data:
    name: netpulse_backend_data

networks:
  netpulse_net:
    name: netpulse_net
    driver: bridge
