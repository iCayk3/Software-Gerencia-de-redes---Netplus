services:
  master:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netpulse_master_server
    restart: unless-stopped
    ports:
      - "${MASTER_PORT:-8090}:8090"
    environment:
      MASTER_PORT: "8090"
      MASTER_DATA_DIR: "/app/data"
      MASTER_ADMIN_PASSWORD: "${MASTER_ADMIN_PASSWORD:-admin_master_secret_2026}"
      MASTER_JWT_SECRET: "${MASTER_JWT_SECRET:-master_super_secret_key_netpulse_2026_telecom}"
    volumes:
      - master_data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/v1/health"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  master_data:
    name: netpulse_master_data
